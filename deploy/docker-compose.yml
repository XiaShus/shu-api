# Sibling stack. Do not replace the 1Panel new-api app on :3000.
# Copy this file to the server and fill environment values there.
# Join the 1Panel app network so SQL_DSN can use 1Panel-mysql-B3nW.
# If compose says network not found, run:
#   docker inspect 1Panel-mysql-B3nW --format '{{range $k,$v := .NetworkSettings.Networks}}{{$k}} {{end}}'
# and set networks.1panel-network.name to that value.

services:
  redis:
    image: redis:6-alpine
    container_name: shu-api-redis
    restart: always
    ports:
      - "127.0.0.1:6375:6379"
    command: redis-server --requirepass CHANGE_ME_REDIS
    networks:
      - default
      - 1panel-network

  new-api:
    image: ghcr.io/xiashus/shu-api:shu
    container_name: shu-api
    restart: always
    command: --log-dir /app/logs
    ports:
      - "3005:3000"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    environment:
      - SQL_DSN=shu_api:CHANGE_ME_SQL@tcp(1Panel-mysql-B3nW:3306)/shu_api?charset=utf8mb4&parseTime=True&loc=Local
      - REDIS_CONN_STRING=redis://:CHANGE_ME_REDIS@redis:6379
      - SESSION_SECRET=CHANGE_ME_SESSION
      - TZ=Asia/Shanghai
      - ERROR_LOG_ENABLED=true
      - BATCH_UPDATE_ENABLED=true
      - NODE_NAME=shu-api
    depends_on:
      - redis
    networks:
      - default
      - 1panel-network

networks:
  1panel-network:
    external: true
    name: 1panel-network
