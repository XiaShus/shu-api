root = "."
tmp_dir = "tmp"

[build]
  bin = "tmp/shu-api.exe"
  cmd = "go build -o ./tmp/shu-api.exe -ldflags \"-X github.com/QuantumNous/new-api/common.Version=v1.0.0-rc.37-6-g043ff99a5\" ."
  delay = 800
  exclude_dir = ["tmp", "vendor", "web", "electron", "docs", "e2e", "logs", "data", ".git", ".xj-cursor", ".gomodcache", ".gocache"]
  exclude_regex = ["_test.go"]
  include_ext = ["go"]
  include_file = [".env"]
  kill_delay = "2s"
  poll = true
  poll_interval = 500
  send_interrupt = true
  stop_on_error = true

[log]
  time = true

[misc]
  clean_on_exit = false
